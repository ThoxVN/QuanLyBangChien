<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gõ Mõ & Mở Hòm Trang Bị</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── HEADER ─── */
    .header {
      background: rgba(15,23,42,0.95);
      border-bottom: 1px solid #1e293b;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
    }
    .back-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      transition: all .2s;
    }
    .back-btn:hover { background: #334155; color: #e2e8f0; }
    .header-title {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ─── MAIN GRID ─── */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 720px) { .main { grid-template-columns: 1fr; } }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 20px;
    }

    /* ─── LUCK ─── */
    .luck-display {
      text-align: center;
      margin-bottom: 20px;
    }
    .luck-number {
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      transition: color .4s;
    }
    .luck-sub { font-size: 13px; color: #475569; margin-top: 4px; }

    .luck-bar-wrap {
      background: #0f172a;
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .luck-bar {
      height: 100%;
      border-radius: 8px;
      transition: width .5s ease, background .5s;
    }

    /* bell */
    .bell-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .bell-wrapper { position: relative; display: flex; justify-content: center; }
    .bell-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #d97706;
      background: radial-gradient(circle at 35% 30%, #1e293b, #0f172a 70%);
      cursor: pointer;
      font-size: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px rgba(245,158,11,.35);
      transition: transform .1s, box-shadow .2s;
      user-select: none;
      -webkit-user-select: none;
      padding: 0;
      overflow: hidden;
    }
    .bell-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      pointer-events: none;
    }
    .bell-btn:hover { box-shadow: 0 0 40px rgba(245,158,11,.55); }
    .bell-btn:active { transform: scale(.92); }
    .bell-btn.ringing { animation: bellRing .55s ease; }
    .bell-btn:disabled { opacity: .5; cursor: not-allowed; }

    @keyframes bellRing {
      0%   { transform: rotate(0deg); }
      12%  { transform: rotate(-18deg); }
      30%  { transform: rotate(16deg); }
      48%  { transform: rotate(-12deg); }
      65%  { transform: rotate(9deg); }
      80%  { transform: rotate(-5deg); }
      100% { transform: rotate(0deg); }
    }

    .ripple {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid #fbbf24;
      animation: rippleAnim .9s ease-out forwards;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      0%   { transform: scale(1); opacity: .7; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    .delta-float {
      position: absolute;
      font-size: 26px;
      font-weight: 800;
      pointer-events: none;
      animation: floatUp 1.1s ease-out forwards;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-70px); }
    }

    .bell-hint { font-size: 12px; color: #475569; text-align: center; }

    /* history */
    .history-label { font-size: 12px; color: #475569; margin-bottom: 8px; }
    .history-list { display: flex; flex-wrap: wrap; gap: 5px; min-height: 28px; }
    .history-chip {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .history-chip.plus  { background: rgba(74,222,128,.12); color: #4ade80; border: 1px solid rgba(74,222,128,.25); }
    .history-chip.minus { background: rgba(239,68,68,.12); color: #ef4444; border: 1px solid rgba(239,68,68,.25); }

    /* ─── CHEST PANEL ─── */
    .chest-icon-wrap {
      text-align: center;
      font-size: 72px;
      margin-bottom: 16px;
      animation: chestGlow 2.2s ease-in-out infinite;
    }
    @keyframes chestGlow {
      0%,100% { filter: drop-shadow(0 0 10px rgba(251,191,36,.25)); transform: scale(1); }
      50%      { filter: drop-shadow(0 0 22px rgba(251,191,36,.55)); transform: scale(1.04); }
    }

    .rates-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 20px; }
    .rate-row { display: flex; align-items: center; gap: 8px; }
    .rate-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .rate-name { font-size: 12px; flex: 0 0 120px; }
    .rate-bar-wrap { flex: 1; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden; }
    .rate-bar-fill { height: 100%; border-radius: 3px; transition: width .55s ease; }
    .rate-pct { font-size: 12px; color: #64748b; width: 40px; text-align: right; }

    .open-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      border-radius: 12px;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .05em;
      transition: all .2s;
    }
    .open-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,158,11,.4); }
    .open-btn:disabled { background: #1e293b; color: #475569; border: 1px solid #334155; transform: none; box-shadow: none; cursor: not-allowed; }

    /* ─── SPIN SECTION ─── */
    .spin-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 32px;
      display: none;
    }
    .spin-section.visible { display: block; }

    .spin-wrapper {
      position: relative;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 22px 0;
    }

    /* edge fade */
    .spin-wrapper::before,
    .spin-wrapper::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 160px;
      z-index: 10;
      pointer-events: none;
    }
    .spin-wrapper::before { left: 0; background: linear-gradient(to right, #1e293b 30%, transparent); border-radius: 16px 0 0 16px; }
    .spin-wrapper::after  { right: 0; background: linear-gradient(to left, #1e293b 30%, transparent); border-radius: 0 16px 16px 0; }

    .center-line {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      background: linear-gradient(to bottom, transparent, #f59e0b 15%, #f59e0b 85%, transparent);
      z-index: 11;
      pointer-events: none;
    }

    .spin-track {
      overflow: hidden;
      height: 182px;
    }

    .spin-strip {
      display: flex;
      gap: 8px;
      will-change: transform;
    }

    .strip-card {
      min-width: 130px;
      height: 170px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .card-icon  { font-size: 38px; }
    .card-name  { font-size: 11px; text-align: center; color: #cbd5e1; font-weight: 500; padding: 0 6px; line-height: 1.3; }
    .card-tier  { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

    /* ─── RESULT OVERLAY ─── */
    .result-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .result-overlay.visible { display: flex; }

    .result-card {
      background: #1e293b;
      border-radius: 24px;
      padding: 44px 48px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      border: 2px solid var(--rc, #fbbf24);
      box-shadow: 0 0 70px var(--rg, rgba(251,191,36,.4));
      animation: resultPop .55s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes resultPop {
      from { transform: scale(.4); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .result-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 12px;
    }
    .result-icon-big { font-size: 76px; margin: 8px 0 12px; }
    .result-item-name { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .result-luck-info { font-size: 13px; color: #475569; margin-top: 12px; }

    .result-close {
      margin-top: 24px;
      padding: 11px 40px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }
    .result-close:hover { background: #334155; }

    /* legendary particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      animation: particleFall linear forwards;
    }
    @keyframes particleFall {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn">← Quay về</a>
  <span class="header-title">⚡ Gõ Mõ & Mở Hòm Trang Bị</span>
</div>

<div class="main">

  <!-- ── LUCK PANEL ── -->
  <div class="panel">
    <div class="panel-title">🔔 Vận May</div>

    <div class="luck-display">
      <div class="luck-number" id="luckNum">0</div>
      <div class="luck-sub">Điểm Vận May</div>
    </div>

    <div class="luck-bar-wrap">
      <div class="luck-bar" id="luckBar" style="width:0%;background:#ef4444"></div>
    </div>

    <div class="bell-area">
      <div class="bell-wrapper" id="bellWrapper">
        <button class="bell-btn" id="bellBtn" onclick="ringBell()">
          <img src="/img/motungkinh.jpg" alt="Mõ">
        </button>
      </div>
      <!-- <div class="bell-hint">60% cơ hội &minus;1 &nbsp;|&nbsp; 40% cơ hội +2</div> -->
    </div>

    <div class="history-label">Lịch sử gõ mõ (mới nhất trước):</div>
    <div class="history-list" id="historyList">
      <span style="color:#334155;font-size:13px;">Chưa gõ lần nào…</span>
    </div>
  </div>

  <!-- ── CHEST PANEL ── -->
  <div class="panel">
    <div class="panel-title">📦 Hòm Trang Bị</div>

    <div class="chest-icon-wrap">📦</div>

    <div class="rates-list" id="ratesList"></div>

    <button class="open-btn" id="openBtn" onclick="openChest()">
      🗝️&nbsp; MỞ HÒM TRANG BỊ
    </button>
  </div>
</div>

<!-- ── SPIN SECTION ── -->
<div class="spin-section" id="spinSection">
  <div class="spin-wrapper">
    <div class="center-line"></div>
    <div class="spin-track" id="spinTrack">
      <div class="spin-strip" id="spinStrip"></div>
    </div>
  </div>
</div>

<!-- ── RESULT OVERLAY ── -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card" id="resultCard">
    <div class="result-badge" id="resBadge"></div>
    <div class="result-icon-big" id="resIcon"></div>
    <div class="result-item-name" id="resName"></div>
    <div class="result-luck-info" id="resLuckInfo"></div>
    <button class="result-close" onclick="closeResult()">Đóng</button>
  </div>
</div>

<script>
// ================================================================
//  CONFIG
// ================================================================
const TIERS = [
  { name: 'Phổ Thông',     color: '#94a3b8', glow: 'rgba(148, 163, 184, 0.45)', baseRate: 55 }, // Xám/Trắng - Đồ rác, nguyên liệu thường
  { name: 'Kỳ Trân',       color: '#f87171', glow: 'rgba(248, 113, 113, 0.45)', baseRate: 23 }, // Đỏ (Game này Đỏ thấp hơn Tím) - Đồ tầm trung
  { name: 'Hiếm Có',       color: '#38bdf8', glow: 'rgba(192, 132, 252, 0.45)', baseRate: 12 }, // Tím - Đồ cao cấp
  { name: 'Bách Luyện',    color: '#c084fc', glow: 'rgba(56, 189, 248, 0.45)',  baseRate: 6 },  // Xanh lam đậm/Sáng - Đồ set tối thượng
  { name: 'Độc Trân',      color: '#fbbf24', glow: 'rgba(251, 191, 36, 0.55)',   baseRate: 4 }   // Vàng Hoàng Kim - Đồ cực phẩm giới hạn
];

const ITEMS = [
  // Thường
  { name: 'Kiếm Gỗ',          tier: 0, icon: '🗡️' },
  { name: 'Khiên Da',          tier: 0, icon: '🛡️' },
  { name: 'Mũ Vải',            tier: 0, icon: '🪖' },
  { name: 'Giày Cỏ',           tier: 0, icon: '👟' },
  { name: 'Nhẫn Đồng',         tier: 0, icon: '🔩' },
  { name: 'Gậy Tre',           tier: 0, icon: '🎋' },
  // Không Phổ Biến
  { name: 'Kiếm Sắt',          tier: 1, icon: '⚔️' },
  { name: 'Giáp Sắt',          tier: 1, icon: '🛡️' },
  { name: 'Mũ Sắt',            tier: 1, icon: '⛑️' },
  { name: 'Ủng Sắt',           tier: 1, icon: '🥾' },
  { name: 'Nhẫn Bạc',          tier: 1, icon: '🔮' },
  { name: 'Cung Ngắn',         tier: 1, icon: '🏹' },
  // Hiếm
  { name: 'Kiếm Thép',         tier: 2, icon: '🔱' },
  { name: 'Giáp Vàng',         tier: 2, icon: '🥇' },
  { name: 'Mũ Bạc',            tier: 2, icon: '👑' },
  { name: 'Đai Rồng',          tier: 2, icon: '🐉' },
  { name: 'Nhẫn Hồng Ngọc',    tier: 2, icon: '💎' },
  { name: 'Trượng Phong Vân',  tier: 2, icon: '🌀' },
  // Sử Thi
  { name: 'Kiếm Huyết Hồng',   tier: 3, icon: '🗡️' },
  { name: 'Giáp Rồng',         tier: 3, icon: '🐲' },
  { name: 'Mũ Thần Vũ',        tier: 3, icon: '✨' },
  { name: 'Giày Phong Vân',    tier: 3, icon: '⚡' },
  { name: 'Nhẫn Hắc Ngọc',     tier: 3, icon: '🌑' },
  { name: 'Cung Huyền Thiên',  tier: 3, icon: '🌠' },
  // Huyền Thoại
  { name: 'Kiếm Thần',         tier: 4, icon: '⚔️' },
  { name: 'Áo Tiên',           tier: 4, icon: '🌟' },
  { name: 'Mũ Thần Long',      tier: 4, icon: '👑' },
  { name: 'Giày Vân Tiêu',     tier: 4, icon: '☁️' },
  { name: 'Nhẫn Thái Cực',     tier: 4, icon: '☯️' },
];

const CARD_W   = 130;
const CARD_GAP = 8;
const CARD_TOT = CARD_W + CARD_GAP; // 138px
const WIN_POS  = 47;
const LUCK_COST_ON_OPEN = 30;

// ================================================================
//  STATE
// ================================================================
let luck     = parseInt(localStorage.getItem('gom_luck') || '0');
let history  = JSON.parse(localStorage.getItem('gom_history') || '[]');
let spinning = false;
let bellCooldown = false;

// ================================================================
//  AUDIO  (Web Audio API – no external files needed)
// ================================================================
function playSound(type) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();

    const osc = (freq, type, start, dur) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, ctx.currentTime + start);
      g.gain.linearRampToValueAtTime(.18, ctx.currentTime + start + .01);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + start + dur);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + .05);
    };

    if (type === 'good') {
      // warm bell chord
      [[440,.0],[554,.04],[660,.08]].forEach(([f,d]) => osc(f,'sine',d,1.3));
    } else if (type === 'bad') {
      // dull thud
      osc(180, 'sine', 0, .35);
      osc(90,  'sine', 0, .25);
    } else if (type === 'spin') {
      osc(800, 'sine', 0, .12);
    } else if (type === 'legendary') {
      [[523,.0],[659,.14],[784,.28],[1047,.42]].forEach(([f,d]) => osc(f,'sine',d,.8));
    } else if (type === 'win') {
      [[660,.0],[880,.1]].forEach(([f,d]) => osc(f,'sine',d,.5));
    }
  } catch(_) {}
}

// ================================================================
//  RATE CALCULATION
// ================================================================
function getAdjustedRates(luckVal) {
  const clamped = Math.max(0, luckVal);
  // multipliers: only Rare+ get boosted; Common/Uncommon diluted automatically
  const mult = [1, 1, 1 + clamped * 0.013, 1 + clamped * 0.019, 1 + clamped * 0.026];
  const raw   = TIERS.map((t, i) => t.baseRate * mult[i]);
  const total = raw.reduce((a, b) => a + b, 0);
  return raw.map(r => r / total * 100);
}

function rollItem(rates) {
  const r = Math.random() * 100;
  let cum = 0, tierIdx = 0;
  for (let i = 0; i < rates.length; i++) {
    cum += rates[i];
    if (r < cum) { tierIdx = i; break; }
  }
  const pool = ITEMS.filter(it => it.tier === tierIdx);
  return pool[Math.floor(Math.random() * pool.length)];
}

// ================================================================
//  UI HELPERS
// ================================================================
function luckColor(v) {
  if (v <= 0)  return '#ef4444';
  if (v < 15)  return '#f97316';
  if (v < 30)  return '#facc15';
  if (v < 50)  return '#4ade80';
  if (v < 75)  return '#60a5fa';
  return '#c084fc';
}

function saveLuck() { localStorage.setItem('gom_luck', luck); }
function saveHistory() { localStorage.setItem('gom_history', JSON.stringify(history)); }

function renderLuck() {
  const numEl = document.getElementById('luckNum');
  const barEl = document.getElementById('luckBar');
  const col   = luckColor(luck);

  numEl.textContent = luck;
  numEl.style.color = col;

  const pct = Math.min(Math.max((luck / 100) * 100, 0), 100);
  barEl.style.width = pct + '%';
  barEl.style.background = col;

  renderRates();
  saveLuck();
}

function renderRates() {
  const rates = getAdjustedRates(luck);
  document.getElementById('ratesList').innerHTML = TIERS.map((t, i) => `
    <div class="rate-row">
      <div class="rate-dot" style="background:${t.color}"></div>
      <div class="rate-name" style="color:${t.color}">${t.name}</div>
      <div class="rate-bar-wrap">
        <div class="rate-bar-fill" style="width:${rates[i].toFixed(2)}%;background:${t.color}"></div>
      </div>
      <div class="rate-pct">${rates[i].toFixed(1)}%</div>
    </div>
  `).join('');
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!history.length) {
    el.innerHTML = '<span style="color:#334155;font-size:13px;">Chưa gõ lần nào…</span>';
    return;
  }
  el.innerHTML = history.slice(-20).reverse().map(d =>
    `<span class="history-chip ${d > 0 ? 'plus' : 'minus'}">${d > 0 ? '+' : ''}${d}</span>`
  ).join('');
  saveHistory();
}

// ================================================================
//  BELL / GÕ MÕ
// ================================================================
function ringBell() {
  if (bellCooldown || spinning) return;
  bellCooldown = true;

  const delta = Math.random() < 0.6 ? -1 : 2;
  luck = Math.max(0, luck + delta);
  history.push(delta);

  // Animate bell
  const btn = document.getElementById('bellBtn');
  btn.classList.add('ringing');
  setTimeout(() => btn.classList.remove('ringing'), 560);

  // Ripple
  const wrapper = document.getElementById('bellWrapper');
  const ripple  = document.createElement('div');
  ripple.className = 'ripple';
  wrapper.appendChild(ripple);
  setTimeout(() => ripple.remove(), 900);

  // Floating delta text
  const float = document.createElement('div');
  float.className = 'delta-float';
  float.textContent = delta > 0 ? `+${delta}` : `${delta}`;
  float.style.color = delta > 0 ? '#4ade80' : '#ef4444';
  wrapper.appendChild(float);
  setTimeout(() => float.remove(), 1200);

  // Sound
  playSound(delta > 0 ? 'good' : 'bad');

  renderLuck();
  renderHistory();

  setTimeout(() => { bellCooldown = false; }, 420);
}

// ================================================================
//  OPEN CHEST
// ================================================================
function openChest() {
  if (spinning) return;
  spinning = true;
  bellCooldown = true;

  document.getElementById('openBtn').disabled = true;
  document.getElementById('bellBtn').disabled = true;

  playSound('spin');

  // Roll the actual result
  const rates  = getAdjustedRates(luck);
  const result = rollItem(rates);

  // Build the strip (60 cards)
  const STRIP_COUNT = 60;
  const stripItems  = Array.from({ length: STRIP_COUNT }, () => rollItem(getAdjustedRates(0)));
  stripItems[WIN_POS] = result; // place result at win position

  // Render strip
  const strip = document.getElementById('spinStrip');
  strip.innerHTML = '';
  strip.style.transition = 'none';
  strip.style.transform   = 'translateX(0)';

  stripItems.forEach(item => {
    const tier = TIERS[item.tier];
    const card = document.createElement('div');
    card.className = 'strip-card';
    card.style.borderColor = tier.color;
    card.innerHTML = `
      <div class="card-icon">${item.icon}</div>
      <div class="card-name">${item.name}</div>
      <div class="card-tier" style="color:${tier.color}">${tier.name}</div>
    `;
    strip.appendChild(card);
  });

  // Show spin section & scroll into view
  const spinSection = document.getElementById('spinSection');
  spinSection.classList.add('visible');
  requestAnimationFrame(() => {
    spinSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Force reflow before animating
  strip.offsetHeight;

  // Calculate target translateX so WIN_POS card is centered in track
  const track = document.getElementById('spinTrack');
  const trackW = track.clientWidth;
  const winCenterInStrip = WIN_POS * CARD_TOT + CARD_W / 2;
  const targetX = trackW / 2 - winCenterInStrip;

  // Kick off animation
  setTimeout(() => {
    strip.style.transition = 'transform 7s cubic-bezier(0.12, 0, 0.05, 1)';
    strip.style.transform  = `translateX(${targetX}px)`;
  }, 80);

  // After animation: highlight + show result
  setTimeout(() => {
    const cards = strip.querySelectorAll('.strip-card');
    const winCard = cards[WIN_POS];
    winCard.style.transition  = 'box-shadow .35s, transform .35s';
    winCard.style.boxShadow   = `0 0 35px ${TIERS[result.tier].color}`;
    winCard.style.transform   = 'scale(1.08)';
    winCard.style.borderColor = TIERS[result.tier].color;

    playSound(result.tier === 4 ? 'legendary' : 'win');

    setTimeout(() => showResult(result), 750);
  }, 7250);
}

// ================================================================
//  RESULT
// ================================================================
function showResult(item) {
  const tier    = TIERS[item.tier];
  const oldLuck = luck;
  luck = Math.max(0, luck - LUCK_COST_ON_OPEN);
  renderLuck();

  // Legendary: spawn particles
  if (item.tier === 4) spawnParticles();

  // Fill modal
  const card = document.getElementById('resultCard');
  card.style.setProperty('--rc', tier.color);
  card.style.setProperty('--rg', tier.glow);

  const badge = document.getElementById('resBadge');
  badge.textContent = tier.name;
  badge.style.background = `rgba(${hexToRgb(tier.color)}, .15)`;
  badge.style.color  = tier.color;
  badge.style.border = `1px solid ${tier.color}`;

  document.getElementById('resIcon').textContent = item.icon;

  const nameEl = document.getElementById('resName');
  nameEl.textContent = item.name;
  nameEl.style.color = tier.color;

  document.getElementById('resLuckInfo').textContent =
    `Vận may: ${oldLuck} → ${luck}  (−${LUCK_COST_ON_OPEN})`;

  document.getElementById('resultOverlay').classList.add('visible');
}

function closeResult() {
  document.getElementById('resultOverlay').classList.remove('visible');
  document.getElementById('spinSection').classList.remove('visible');
  spinning = false;
  bellCooldown = false;
  document.getElementById('openBtn').disabled = false;
  document.getElementById('bellBtn').disabled = false;
}

// ================================================================
//  PARTICLES (Huyền Thoại only)
// ================================================================
function spawnParticles() {
  const wrap = document.createElement('div');
  wrap.className = 'particles';
  document.body.appendChild(wrap);

  const emojis = ['⭐','✨','💫','🌟','👑'];
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left            = Math.random() * 100 + 'vw';
    p.style.top             = '-30px';
    p.style.fontSize        = (14 + Math.random() * 22) + 'px';
    p.style.animationDuration    = (.8 + Math.random() * 1.8) + 's';
    p.style.animationDelay       = (Math.random() * 1.2) + 's';
    p.style.animationFillMode    = 'forwards';
    wrap.appendChild(p);
  }

  setTimeout(() => wrap.remove(), 4000);
}

// ================================================================
//  UTIL
// ================================================================
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

// ================================================================
//  INIT
// ================================================================
renderLuck();
renderHistory();
</script>
